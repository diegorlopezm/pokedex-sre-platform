---
- name: Configure GitHub Actions Runner
  hosts: sre-runner
  become: true
  roles:
    - github_runner

- name: "Configure SRE Storage Node"
  hosts: sre-storage
  become: true
  roles:
    - zfs_storage

- name: Configure SRE Monitor
  hosts: sre-monitor
  become: true
  roles:
    - observability
