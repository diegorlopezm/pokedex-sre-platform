---
- name: Install NFS client
  ansible.builtin.apt:
    name: nfs-common
    state: present

- name: Crear puntos de montaje
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    mode: '0755'
  loop:
        - /mnt/vmdata
        - /mnt/lokidata

- name: Mount VM data
  ansible.posix.mount:
    src: "{{ hostvars['sre-storage']['ansible_host'] }}:/zdata/vm"
    path: /mnt/vmdata
    fstype: nfs
    opts: rw,sync,hard,nofail,_netdev
    state: mounted

- name: Mount Loki data
  ansible.posix.mount:
    src: "{{ hostvars['sre-storage']['ansible_host'] }}:/zdata/loki"
    path: /mnt/lokidata
    fstype: nfs
    opts: rw,async,hard,nofail,_netdev
    state: mounted
