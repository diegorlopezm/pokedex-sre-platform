---
- name: Install NFS client
  ansible.builtin.apt:
    name: nfs-common
    state: present

- name: Create mount points
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
        - /mnt/vmdata
        - /mnt/lokidata

- name: Mount VM
  ansible.posix.mount:
    src: "{{ hostvars['sre-storage']['ansible_host'] }}:/zdata/vm"
    path: /mnt/vmdata
    fstype: nfs
    opts: rw,sync,hard
    state: mounted

- name: Mount Loki data
  ansible.posix.mount:
    src: "{{ hostvars['sre-storage']['ansible_host'] }}:/zdata/loki"
    path: /mnt/lokidata
    fstype: nfs
    opts: rw,async,hard
    state: mounted

- name: Crear subdirectorios para volúmenes Docker
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: '0755'
  loop:
    - /mnt/vmdata/alertmanager
    - /mnt/vmdata/grafana
