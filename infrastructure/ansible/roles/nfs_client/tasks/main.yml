- name: Install NFS client
  ansible.builtin.apt:
    name: nfs-common
    state: present

- name: Create mount point
  ansible.builtin.file:
    path: /mnt/vmdata
    state: directory

- name: Mount ZFS dataset from sre-storage
  ansible.posix.mount:
    src: "192.168.56.12:/zdata/vm"
    path: /mnt/vmdata
    fstype: nfs
    opts: rw,sync,hard
    state: mounted
