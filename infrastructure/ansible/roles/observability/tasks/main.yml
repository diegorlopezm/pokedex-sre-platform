---
- name: Crear /opt/monitoring
  ansible.builtin.file:
    path: /opt/monitoring
    state: directory
    mode: '0755'

- name: Copiar docker-compose.yml
  ansible.builtin.copy:
    src: docker-compose.yml
    dest: /opt/monitoring/docker-compose.yml
    mode: '0644'
  notify: Reiniciar monitoring

- name: Copiar alerts.yml
  ansible.builtin.copy:
    src: alerts.yml
    dest: /opt/monitoring/alerts.yml
    mode: '0644'

- name: Copiar alertmanager.yml
  ansible.builtin.copy:
    src: alertmanager.yml
    dest: /opt/monitoring/alertmanager.yml
    mode: '0644'

- name: Renderizar config.alloy desde template
  ansible.builtin.template:
    src: config.alloy.j2
    dest: /opt/monitoring/config.alloy
    mode: '0644'
  notify: Reiniciar monitoring

- name: Levantar stack
  community.docker.docker_compose_v2:
    project_src: /opt/monitoring
    state: present
    pull: missing
