---
- name: Install apt prerequisites for repositories
  ansible.builtin.apt:
    name:
            - gnupg
            - ca-certificates
    state: present
    update_cache: true

- name: "1. Ensure repos"
  ansible.builtin.apt_repository:
    repo: "deb http://deb.debian.org/debian trixie-backports main contrib non-free"
    state: present
    filename: trixie-backports

- name: "2. Update"
  ansible.builtin.apt:
    update_cache: yes
    upgrade: dist

- name: "3. Install ZFS + NFS"
  ansible.builtin.apt:
    name:
      - linux-headers-amd64
      - zfsutils-linux
      - zfs-dkms
      - nfs-kernel-server
    default_release: trixie-backports
    state: present
    update_cache: true

- name: "4. Check reboot"
  ansible.builtin.stat:
    path: /var/run/reboot-required
  register: reboot_required

- name: "5. Reboot"
  ansible.builtin.reboot:
  when: reboot_required.stat.exists

- name: "5b. Ensure ZFS kernel module is loaded"
  ansible.builtin.command: modprobe zfs
  changed_when: false
  failed_when: false

- name: "6. Create pool"
  community.general.zpool:
    name: "{{ pool_name }}"
    vdevs:
      - type: mirror
        disks: "{{ disks }}"
    state: present

- name: "7. Create datasets"
  community.general.zfs:
    name: "{{ pool_name }}/{{ item.name }}"
    state: present
    extra_zfs_properties: "{{ item.props }}"
  loop:
        - { name: postgres, props: { recordsize: '8k', compression: 'lz4' } }
        - { name: vm, props: { recordsize: '128k', compression: 'lz4', atime: 'off' } }
        - { name: loki, props: { recordsize: '128k', compression: 'zstd', atime: 'off' } }

- name: "7b. Permisos para VictoriaMetrics"
  ansible.builtin.file:
    path: "/{{ pool_name }}/vm"
    owner: 1000
    group: 1000
    state: directory
    recurse: yes

- name: "7c. Permisos para Loki"
  ansible.builtin.file:
    path: "/{{ pool_name }}/loki"
    owner: 10001
    group: 10001
    state: directory
    recurse: yes
- name: "8. Export NFS"
  ansible.builtin.lineinfile:
    path: /etc/exports
    line: "/{{ pool_name }}/{{ item }} 192.168.56.0/24(rw,sync,no_subtree_check,no_root_squash)"
    create: yes
  loop: [vm, loki]
  notify: Reload NFS
